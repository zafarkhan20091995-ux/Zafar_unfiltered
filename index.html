<meta charset="UTF-8">

<title>Zafar Unfiltered | Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 55px 20px 35px;
}

h1 {
  font-size: 44px;
  margin: 0 0 10px;
  letter-spacing: 2px;
}

header p {
  color: #aaa;
  font-size: 18px;
}

.gallery {
  max-width: 1400px;
  margin: auto;
  padding: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}

.gallery img {
  width: 100%;
  height: 430px;
  object-fit: cover;
  border-radius: 14px;
  display: block;
  transition: transform .3s;
}

.gallery img:hover {
  transform: scale(1.02);
}

footer {
  text-align: center;
  padding: 40px;
  color: #777;
}
</style>
</head>
